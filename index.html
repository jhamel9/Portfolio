#intro .w2{font-weight:800;font-size:clamp(24px,6vw,74px);letter-spacing:.6em;line-height:1.1}
#intro .wt.in>div{opacity:1;filter:blur(0);transform:scale(1)}
#intro .wt.in .w1,#intro .wt.in .w3{letter-spacing:.5em}

#map .dim{opacity:.16}

@keyframes mpulse{from{transform:scale(1);opacity:.95}to{transform:scale(2.4);opacity:0}}
#nav button{padding:7px 14px;font-size:12px}
#nav .nt{display:none}
#ns{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:999px;background:rgba(20,26,34,.62);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;font:600 12px system-ui,sans-serif;position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30}

#ns button{padding:5px 12px;font-size:12px}

@media(max-width:600px){#nav button{padding:6px 10px;font-size:11px}#map{height:min(64vh,560px);right:4px}#h{display:none}}

<script>
const V=(x,y,z)=>new THREE.Vector3(x,y,z),PI=Math.PI,lerp=THREE.MathUtils.lerp,UP=V(0,1,0);
/* quality tier: auto-detect weak devices, override with ?q=low or ?q=high */
const _qp=new URLSearchParams(location.search).get('q');
const LOW=_qp?_qp==='low':(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4);
let dpr=LOW?1:Math.min(devicePixelRatio,2);
const R=new THREE.WebGLRenderer({antialias:!LOW,powerPreference:'high-performance'});R.setPixelRatio(dpr);R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=!LOW;R.shadowMap.autoUpdate=false;R.shadowMap.type=THREE.PCFShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(R.domElement);
const S=new THREE.Scene(),bg=new THREE.Color(0xc9d2d8);S.background=bg;S.fog=new THREE.FogExp2(0xc9d2d8,.0165);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,LOW?160:300);
let cctvRT=null,cctvCam=null;
const anim=[];

/* ---------- loading screen ---------- */
{
  const ld=document.getElementById('ld'),lbar=document.getElementById('lbar');
  function startCloudIntro(){
    if(window.WA)WA.whoosh();
    // camera starts high above the clouds, looking down, then descends to the normal view
    introAnim={t0:performance.now(),dur:7600,p0:V(viewOut.p.x+8,150,viewOut.p.z+8),pitch0:-1.5};
    camState.p.copy(introAnim.p0);
    camState.pitch=introAnim.pitch0;
    const box=document.createElement('div');box.id='ci';
    const c=document.createElement('canvas');
    const tx=document.createElement('div');tx.className='wt';
    tx.innerHTML='<div class="w1">Welcome to</div><div class="w2">Jhamel\'s Warehouse</div><div class="w3">Portfolio</div>';
    box.append(c,tx);document.body.appendChild(box);
    const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),MX=Math.max(W,H),cx=W/2,cy=H/2;
    // soft cloud puff sprites: grey-blue underside shading + white billows
    const mkS=()=>{
      const s=document.createElement('canvas');s.width=s.height=256;const g=s.getContext('2d');
      const blobs=[];
      for(let i=0;i<20;i++)blobs.push([128+(Math.random()-.5)*130,128+(Math.random()-.5)*110,22+Math.random()*46,.35+Math.random()*.65]);
      // dense grey-blue shadowed cores for contrast
      blobs.forEach(([px,py,r,a])=>{
        const gr=g.createRadialGradient(px+6,py+14,0,px+6,py+14,r*1.05);
        gr.addColorStop(0,'rgba(120,136,158,'+(.55*a).toFixed(2)+')');gr.addColorStop(.7,'rgba(150,164,184,'+(.2*a).toFixed(2)+')');gr.addColorStop(1,'rgba(150,164,184,0)');
        g.fillStyle=gr;g.fillRect(0,0,256,256);
      });
      // bright sunlit tops with uneven opacity
      blobs.forEach(([px,py,r,a])=>{
        const gr=g.createRadialGradient(px-4,py-8,0,px-4,py-8,r*.9);
        gr.addColorStop(0,'rgba(255,255,255,'+(.98*a).toFixed(2)+')');gr.addColorStop(.55,'rgba(255,255,255,'+(.5*a).toFixed(2)+')');gr.addColorStop(1,'rgba(255,255,255,0)');
        g.fillStyle=gr;g.fillRect(0,0,256,256);
      });
      return s;
    };
    const SPR=[mkS(),mkS(),mkS(),mkS(),mkS()];
    const N=innerWidth<700?36:72,P=[];
    for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,s:(.25+Math.random()*.7)*MX,sp:SPR[i%5],z:.4+Math.random()*1.5,al:.2+Math.random()*.8,pw:.8+Math.random()*1.2,rot:Math.random()*PI*2});
    const ease=u=>{u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)};
    const t0=performance.now();
    setTimeout(()=>tx.classList.add('in'),700);
    setTimeout(()=>{tx.classList.remove('in');tx.classList.add('out')},4300);
    (function f(){
      const t=(performance.now()-t0)/1000;
      if(t>8){box.remove();camRate=10;return}
      x.clearRect(0,0,W,H);
      // white sky layer that thins out as the camera drops through the clouds
      const bw=1-ease((t-2.6)/4.4);
      if(bw>.003){
        // uneven sky layer: bright centre, soft blue-grey depth toward the edges
        const sg=x.createRadialGradient(cx,cy,0,cx,cy,MX*.75);
        sg.addColorStop(0,'rgba(255,255,255,'+bw.toFixed(3)+')');
        sg.addColorStop(1,'rgba(206,218,234,'+bw.toFixed(3)+')');
        x.fillStyle=sg;x.fillRect(0,0,W,H);
      }
      // looking straight down: cloud layers rush outward from the centre past the camera, then dissolve
      const k=ease((t-1.2)/5.4);
      P.forEach(p=>{
        const grow=Math.pow(1+k*2.6,p.z);
        const px=cx+(p.x-cx)*grow,py=cy+(p.y-cy)*grow;
        const sz=p.s*grow;
        const al=p.al*(1-Math.pow(k,p.pw*1.3));
        if(al<=.004)return;
        x.globalAlpha=Math.min(1,al);
        x.save();x.translate(px,py);x.rotate(p.rot+t*.02*p.z);
        x.drawImage(p.sp,-sz/2,-sz/2,sz,sz);
        x.restore();
      });
      x.globalAlpha=1;
      requestAnimationFrame(f);
    })();
  }
  function startIntro(){
    const box=document.createElement('div');box.id='intro';
    const c=document.createElement('canvas');
    const bt=document.createElement('div'),bb=document.createElement('div');bt.className='bar t';bb.className='bar b';
    const tx=document.createElement('div');tx.className='wt';
    tx.innerHTML='<div class="w1">Welcome to</div><div class="w2">Jhamel\'s Warehouse</div><div class="w3">Portfolio</div>';
    box.append(c,bt,bb,tx);document.body.appendChild(box);
    const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d'),M=Math.max(W,H),cx=W/2,cy=H/2;
    // lumpy soft smoke sprites (pre-rendered for speed)
    const mkS=()=>{
      const s=document.createElement('canvas');s.width=s.height=256;const g=s.getContext('2d');
      for(let i=0;i<16;i++){
        const px=128+(Math.random()-.5)*100,py=128+(Math.random()-.5)*100,r=35+Math.random()*55;
        const gr=g.createRadialGradient(px,py,0,px,py,r);
        gr.addColorStop(0,'rgba(176,186,196,.30)');gr.addColorStop(.6,'rgba(150,160,172,.12)');gr.addColorStop(1,'rgba(150,160,172,0)');
        g.fillStyle=gr;g.fillRect(0,0,256,256);
      }
      return s;
    };
    const SPR=[mkS(),mkS(),mkS(),mkS()];
    const N=innerWidth<700?42:84,P=[];
    for(let i=0;i<N;i++){
      const a=Math.random()*PI*2,d=Math.pow(Math.random(),.7)*M*.65;
      P.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*.8,s:(.35+Math.random()*.55)*M,sp:SPR[i%4],rot:Math.random()*PI*2,rv:(Math.random()-.5)*.18,al:.5+Math.random()*.5,vx:(Math.random()-.5)*26,vy:-6-Math.random()*16,pw:1.2+Math.random()*1.4,gr:.05+Math.random()*.08});
    }
    const ease=u=>{u=Math.max(0,Math.min(1,u));return u*u*(3-2*u)};
    const t0=performance.now();
    setTimeout(()=>tx.classList.add('in'),1300);
    setTimeout(()=>{tx.classList.remove('in');tx.classList.add('out')},5500);
    setTimeout(()=>{bt.classList.add('out');bb.classList.add('out')},6000);
    (function f(){
      const t=(performance.now()-t0)/1000;
      if(t>8.2){box.remove();return}
      x.globalCompositeOperation='source-over';
      x.clearRect(0,0,W,H);
      // dark haze that lifts as the smoke parts
      const part=ease((t-2.4)/4.2);
      x.fillStyle='rgba(6,8,12,'+(.82*(1-part)).toFixed(3)+')';x.fillRect(0,0,W,H);
      // billowing smoke, pushed outward from the centre once it starts to part
      P.forEach(p=>{
        const k=ease((t-2.4)/4.6),push=k*k*1.9;
        const px=p.x+p.vx*t+(p.x-cx)*push,py=p.y+p.vy*t+(p.y-cy)*push;
        const sz=p.s*(1+t*p.gr)*(1+k*.5),al=p.al*(1-Math.pow(k,p.pw*.9));
        if(al<=.003)return;
        x.globalAlpha=Math.min(1,al*Math.min(1,t*1.4));
        x.save();x.translate(px,py);x.rotate(p.rot+p.rv*t);
        x.drawImage(p.sp,-sz/2,-sz/2,sz,sz);
        x.restore();
      });
      x.globalAlpha=1;
      // warm light shaft cutting through the smoke
      const lt=Math.sin(PI*Math.max(0,Math.min(1,(t-1)/5.5)));
      if(lt>.01){
        x.globalCompositeOperation='lighter';
        const g=x.createRadialGradient(cx,cy*.8,0,cx,cy*.8,M*.55);
        g.addColorStop(0,'rgba(255,214,150,'+(.26*lt).toFixed(3)+')');g.addColorStop(1,'rgba(255,214,150,0)');
        x.fillStyle=g;x.fillRect(0,0,W,H);
        x.save();x.translate(cx,-H*.1);x.rotate(.28);
        const b=x.createLinearGradient(-M*.09,0,M*.09,0);
        b.addColorStop(0,'rgba(255,230,190,0)');b.addColorStop(.5,'rgba(255,230,190,'+(.11*lt).toFixed(3)+')');b.addColorStop(1,'rgba(255,230,190,0)');
        x.fillStyle=b;x.fillRect(-M*.09,0,M*.18,M*1.6);
        x.restore();
        x.globalCompositeOperation='source-over';
      }
      // cinematic vignette
      const v=x.createRadialGradient(cx,cy,M*.25,cx,cy,M*.85);
      v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,'+(.65*(1-part*.6)).toFixed(3)+')');
      x.fillStyle=v;x.fillRect(0,0,W,H);
      requestAnimationFrame(f);
    })();
  }
  const t0=performance.now();
  let hidden=false;
  const hide=()=>{
    if(hidden)return;hidden=true;
    const wait=Math.max(0,900-(performance.now()-t0));
    setTimeout(()=>{
      const lc=document.createElement('div');lc.className='lc';lc.textContent='Click to proceed';
      ld.appendChild(lc);ld.classList.add('ready');
      let go=false;
      const enter=()=>{
        if(go)return;go=true;
        removeEventListener('keydown',enter);
        startCloudIntro();ld.classList.add('done');setTimeout(()=>ld.remove(),800);
      };
      ld.addEventListener('click',enter);
      addEventListener('keydown',enter);
    },wait);
  };
  THREE.DefaultLoadingManager.onProgress=(u,l,t)=>{if(t)lbar.style.width=Math.round(l/t*100)+'%'};
  THREE.DefaultLoadingManager.onLoad=()=>{lbar.style.width='100%';hide()};
  THREE.DefaultLoadingManager.onError=()=>{};
  setTimeout(hide,10000);
  addEventListener('load',()=>setTimeout(hide,2500));

      s.buffer=WN;f.type='highpass';f.frequency.value=freq;
      g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
      s.connect(f);f.connect(g);g.connect(p);s.start(T,Math.random()*1.5,dur+.05);
      setTimeout(()=>p.disconnect(),(dur+.5)*1000);
    };
    const ev=(k,t,gap,fn)=>{
      if(nxt[k]===undefined)nxt[k]=t+Math.random()*3;
      if(t>=nxt[k]){fn();nxt[k]=t+gap()}
    };
    const R=(a,b)=>a+Math.random()*(b-a);

    /* --- per-frame: listener follows the camera, dynamic + random sounds --- */
    window.WA.update=t=>{
      if(!on||ac.state!=='running')return;
      const L=ac.listener,p=cam.position,d=dirFrom();
      if(L.positionX){
        L.positionX.value=p.x;L.positionY.value=p.y;L.positionZ.value=p.z;
        L.forwardX.value=d.x;L.forwardY.value=d.y;L.forwardZ.value=d.z;
        L.upX.value=0;L.upY.value=1;L.upZ.value=0;
      }else{L.setPosition(p.x,p.y,p.z);L.setOrientation(d.x,d.y,d.z,0,1,0)}
      const T=ac.currentTime;
      dyn.prn.frequency.setTargetAtTime(110+90*Math.abs(Math.sin(t*2.2)),T,.05);
      const dr=Math.max(0,Math.sin(t*1.6));
      dyn.drill.g.gain.setTargetAtTime(.1*dr,T,.06);dyn.drill.o.frequency.setTargetAtTime(150+60*dr,T,.1);
      dyn.drillN.g.gain.setTargetAtTime(.07*dr,T,.06);
      dyn.ptr.g.gain.setTargetAtTime(Math.sin(t*3)>0?.05:.008,T,.08);
      // other 3D printers: stepper pitch follows the print head motion
      dyn.prn2.frequency.setTargetAtTime(100+95*Math.abs(Math.sin(t*2.4+2)),T,.05);
      dyn.prn3.frequency.setTargetAtTime(130+90*Math.abs(Math.cos(t*2.6+1)),T,.05);
      // metal printer glow pulse
      dyn.mp.g.gain.setTargetAtTime(.02+.015*Math.sin(t*3),T,.1);
      // CCTV servo while the joystick is being dragged
      if(window.cctvCtl){
        const C=window.cctvCtl,m=Math.min(1,Math.abs(C.jx-C.cy)*6+Math.abs(C.jy-C.cp)*6);
        dyn.servo.g.gain.setTargetAtTime(.06*m,T,.05);
        dyn.servo.o.frequency.setTargetAtTime(300+260*m,T,.1);
      }
      // drill press: chuck clunk and quill thud at the start/end of each plunge
      if(dr>.05&&!dyn.drillOn){dyn.drillOn=true;tick([11.2,1.5,-14.3],1800,.07,.25);tone([11.2,1.5,-14.3],'triangle',420,240,.12,.18)}
      else if(dr<=.02&&dyn.drillOn){dyn.drillOn=false;tone([11.2,1.5,-14.3],'sine',200,90,.14,.2)}
      // basketball dribble on the court
      ev('ball',t,()=>1.0+Math.random()*.15,()=>{tone([-6,.3,3],'sine',110,48,.16,.7);tick([-6,.1,3],900,.05,.2)});
      // metal weights clank in the gym
      ev('weight',t,()=>R(4,9),()=>{const q=[-10.4,1,12];tone(q,'triangle',820,780,.5,.12);tone(q,'sine',1290,1250,.35,.07);tick(q,3000,.06,.25)});
      // bathroom water drip
      ev('drip',t,()=>R(1.4,4),()=>tone([-9,3,-17.5],'sine',1500,700,.09,.22));
      // CCTV beep
      ev('beep',t,()=>6,()=>tone([0,6.6,19.3],'square',1800,1800,.08,.05));
      // keyboard typing bursts at the loft battlestation and the labs
      ev('type',t,()=>R(5,10),()=>{
        const pos=Math.random()<.5?[1.9,4.4,-19]:[11.3,1,-4.5];
        const n=4+Math.floor(Math.random()*6);
        for(let i=0;i<n;i++)setTimeout(()=>tick(pos,2500,.025,.12),i*(70+Math.random()*90));
      });
      // far-off clang somewhere inside the warehouse
      ev('clang',t,()=>R(9,20),()=>{
        const q=[R(-9,9),R(.5,3),R(-16,16)],f=R(500,1400);
        tone(q,'triangle',f,f*.98,1.1,.12);tone(q,'sine',f*1.51,f*1.5,.7,.06);
      });
      // wind gust outside
      ev('gust',t,()=>R(12,24),()=>{
        const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),pp=mkPan(R(-18,18),3,R(18,28));
        s.buffer=WN;f.type='bandpass';f.frequency.setValueAtTime(300,T);f.frequency.linearRampToValueAtTime(700,T+2.5);f.Q.value=.8;
        g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(.12,T+1.4);g.gain.linearRampToValueAtTime(.0001,T+3.2);
        s.connect(f);f.connect(g);g.connect(pp);s.start(T,0,3.4);setTimeout(()=>pp.disconnect(),4000);
      });
    };
  };

  /* --- intro whoosh (falling through the clouds) --- */
  const doWhoosh=()=>{
    const T=ac.currentTime,s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=WN;s.loop=true;bp.type='bandpass';bp.Q.value=1.1;
    bp.frequency.setValueAtTime(250,T);bp.frequency.exponentialRampToValueAtTime(3200,T+2.8);bp.frequency.exponentialRampToValueAtTime(300,T+6.4);
    g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(1,T+2.6);g.gain.exponentialRampToValueAtTime(.0001,T+6.6);
    let last=g;
    if(ac.createStereoPanner){const sp=ac.createStereoPanner();sp.pan.setValueAtTime(-.7,T);sp.pan.linearRampToValueAtTime(.7,T+2.2);sp.pan.linearRampToValueAtTime(-.3,T+4);g.connect(sp);last=sp}
    s.connect(bp);bp.connect(g);last.connect(master);s.start(T);s.stop(T+6.8);
    const o=ac.createOscillator(),og=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(150,T);o.frequency.exponentialRampToValueAtTime(34,T+6);
    og.gain.setValueAtTime(.0001,T);og.gain.linearRampToValueAtTime(.6,T+2.4);og.gain.exponentialRampToValueAtTime(.0001,T+6.4);
    o.connect(og);og.connect(master);o.start(T);o.stop(T+6.6);
  };
  window.WA={update(){},whoosh(){if(ac&&on&&ac.state==='running')doWhoosh();else pend=performance.now()}};

  const setOn=v=>{
    on=v;
    if(!ac)build();
    if(ac.state==='suspended')ac.resume();
    master.gain.setTargetAtTime(v?.5:0,ac.currentTime,.4);
    sn.innerHTML=v?ICON_VOL_ON:ICON_VOL_OFF;
    sn.title=v?'Sound: On':'Sound: Off';
  };
  sn.onclick=()=>setOn(!on);
  const first=e=>{
    if(e.target&&e.target.closest&&e.target.closest('#sn'))return;
    if(!ac)setOn(true);
    const done=()=>{
      if(!ac||ac.state!=='running')return;
      HOOKS.forEach(ev=>removeEventListener(ev,first));
      if(on&&pend&&performance.now()-pend<7000){pend=0;doWhoosh()}
    };
    if(on&&ac.state!=='running')ac.resume().then(done).catch(()=>{});else done();
  };
  // mouse hover (and touch/click/key/scroll as fallbacks for browsers that only accept real clicks) starts the audio
  const HOOKS=['pointermove','mousemove','pointerdown','keydown','touchstart','wheel'];
  HOOKS.forEach(ev=>addEventListener(ev,first,{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on)ac.resume()});
}
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

/* ---------- freeze static transforms (skips thousands of matrix updates per frame) ---------- */
S.updateMatrixWorld(true);
S.traverse(o=>{if((o.isMesh||o.isSprite||o.isPoints||o.isLine)&&!o.userData.anim)o.matrixAutoUpdate=false});

/* ---------- loop ---------- */
const clock=new THREE.Clock();
let frameN=0,fpsAcc=0,fpsCnt=0,lastT=0;
(function loop(){requestAnimationFrame(loop);
  if(document.hidden)return;
  const _now=performance.now();
  if(LOW&&_now-lastT<30)return;
  lastT=_now;
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  fans.forEach(f=>f.g.rotation[f.axis||'x']+=dt*5);
  if(window.rgbFX)rgbFX(t);
  if(window.WA)WA.update(t);
  if(window.cctvCtl)window.cctvCtl.aim();
  if(window.joyOL){const jd=cam.position.distanceTo(window.joyPos);if(joyDrag!==null||jd<2.2)window.joyNear=true;else if(jd>2.8)window.joyNear=false;const nr=!!window.joyNear;if(nr!==window.joyShown){window.joyShown=nr;window.joyOL.forEach(o=>o.visible=nr);const jhEl=document.getElementById('jh');if(jhEl)jhEl.classList.toggle('show',nr)}
    if(window.joyShown){const jh2=document.getElementById('jh');if(jh2){const jv=window.joyPos.clone();jv.y+=.22;jv.project(cam);if(jv.z>1||jv.z<-1){jh2.style.opacity=0}else{jh2.style.opacity='';jh2.style.left=((jv.x*.5+.5)*innerWidth)+'px';jh2.style.top=((-jv.y*.5+.5)*innerHeight)+'px'}}}}
  for(let i=0;i<anim.length;i++)anim[i](t);
  if(Math.abs(goal-k)>.002){k+=(goal-k)*Math.min(1,dt*2.5);apply(k)}else if(k!==goal){k=goal;apply(k)}
  if(keys.size&&freeOrbit){camRate=10;camRateCur=10;const sp=(keys.has('shift')?32:10)*dt*SENS,cy=Math.cos(camState.yaw),sy=Math.sin(camState.yaw);
    if(keys.has('w')){camGoal.p.x+=sy*sp;camGoal.p.z+=cy*sp}
    if(keys.has('s')){camGoal.p.x-=sy*sp;camGoal.p.z-=cy*sp}
    if(keys.has('d')){camGoal.p.x-=cy*sp;camGoal.p.z+=sy*sp}
    if(keys.has('a')){camGoal.p.x+=cy*sp;camGoal.p.z-=sy*sp}
    if(keys.has('q'))camGoal.p.y+=sp;
    if(keys.has('e'))camGoal.p.y-=sp;
  }
  camGoal.p.y=Math.max(.5,camGoal.p.y);
  camRateCur+=(camRate-camRateCur)*Math.min(1,dt*2.5);
  if(introAnim){
    const u=Math.min(1,(performance.now()-introAnim.t0)/introAnim.dur),e=u*u*u*(u*(u*6-15)+10);
    camState.p.lerpVectors(introAnim.p0,camGoal.p,e);
    camState.pitch=lerp(introAnim.pitch0,camGoal.pitch,e);
    if(u>=1){introAnim=null;camState.p.copy(camGoal.p);camState.pitch=camGoal.pitch}
  }
  const a=introAnim?0:Math.min(1,dt*camRateCur);camState.yaw+=(camGoal.yaw-camState.yaw)*a;camState.pitch+=(camGoal.pitch-camState.pitch)*a;camState.p.lerp(camGoal.p,a);
  const cp=Math.cos(camState.pitch);cam.position.copy(camState.p);
  cam.lookAt(camState.p.x+Math.sin(camState.yaw)*cp,camState.p.y+Math.sin(camState.pitch),camState.p.z+Math.cos(camState.yaw)*cp);
  if(frameN%3===0){for(let i=0;i<dn;i++){dp[i*3+1]+=.012*Math.sin(t+i);dp[i*3]+=.009*Math.cos(t*.7+i)}dg.attributes.position.needsUpdate=true}
  if(!LOW&&frameN%3===0)R.shadowMap.needsUpdate=true;
  if(window.sumoLbl)window.sumoLbl.forEach(L=>{const d=cam.position.distanceTo(L.s.position),o=Math.max(0,Math.min(1,(8-d)/3));L.m.opacity=o;L.s.visible=o>0;if(o>0){L.s.position.y=L.base+Math.sin(t*2)*.04;L.s.updateMatrix()}});
  frameN++;
  if(cctvRT&&cctvCam&&frameN%(LOW?6:2)===0){const _sa=R.shadowMap.autoUpdate;R.shadowMap.autoUpdate=false;const _cs=window.cctvScr||[];_cs.forEach(o=>o.visible=false);R.setRenderTarget(cctvRT);R.render(S,cctvCam);R.setRenderTarget(null);_cs.forEach(o=>o.visible=true);R.shadowMap.autoUpdate=_sa;}
  if(frameN>120){fpsAcc+=dt;fpsCnt++;if(fpsAcc>=2){const fps=fpsCnt/fpsAcc;fpsAcc=0;fpsCnt=0;if(fps<40&&dpr>.6){dpr=Math.max(.6,dpr-.15);R.setPixelRatio(dpr);R.setSize(innerWidth,innerHeight)}}}
  R.render(S,cam)})();
</script></body></html>
